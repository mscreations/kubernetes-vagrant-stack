- name: Install ArgoCD
  hosts: controlplane[0]
  become: true

  tasks:
    - name: Copy files to control plane for deployment
      ansible.builtin.copy:
        src: "{{ item.local }}"
        dest: "{{ item.remote }}"
        mode: '0644'
      loop:
        - { local: '../cluster-apps/apps/system/argocd', remote: '/tmp/argocd' }
        - { local: '../cluster-apps/bootstrap/repo-secret.yaml', remote: '/tmp/repo-secret.yaml' }
        - { local: '../cluster-apps/bootstrap/projects.yaml', remote: '/tmp/projects.yaml' }
        - { local: '../cluster-apps/bootstrap/applicationset.yaml', remote: '/tmp/applicationset.yaml' }

    - name: Install ArgoCD
      kubernetes.core.k8s:
        definition: "{{ lookup('kubernetes.core.kustomize', dir='/tmp/argocd', binary_path='/usr/bin/kubectl') }}"
        server_side_apply:
          field_manager: ansible
          force_conflicts: true

    - name: Install Repo Secret
      kubernetes.core.k8s:
        state: present
        src: /tmp/repo-secret.yaml

    - name: Install Projects
      kubernetes.core.k8s:
        state: present
        src: /tmp/projects.yaml

    - name: Install ApplicationSet
      kubernetes.core.k8s:
        state: present
        src: /tmp/applicationset.yaml