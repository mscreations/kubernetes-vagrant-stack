- name: Install ArgoCD
  hosts: controlplane[0]
  become: true

  tasks:
    - name: Add ArgoCD Helm Repo
      kubernetes.core.helm_repository:
        name: argo
        repo_url: https://argoproj.github.io/argo-helm

    - name: Install ArgoCD
      kubernetes.core.helm:
        name: argocd
        chart_ref: argo/argo-cd
        namespace: argocd
        create_namespace: true
        valuesfiles:
          - ./cluster-apps/bootstrap/argocd/values.yaml
        state: present

    - name: Install Repo Secret
      kubernetes.core.k8s:
        state: present
        src: ./cluster-apps/bootstrap/repo-secret.yaml

    - name: Install ApplicationSet
      kubernetes.core.k8s:
        state: present
        src: ./cluster-apps/bootstrap/applicationset.yaml